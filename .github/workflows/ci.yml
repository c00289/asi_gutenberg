# Continuous integration: every push to main, every v* tag and every pull request runs ruff and pytest on
# windows-latest, the owner's platform. A release is green by this, not by anyone's word. The QF-17 tests skip
# here (asi_standards is private and is not checked out) and so do the Word tests (the runner has no Word).
# asi_gutenberg depends on asi_escher as editable path sources (../<sibling>), so each sibling is checked
# out beside it under the workspace and every step runs inside asi_gutenberg/.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: asi_gutenberg
    steps:
      - uses: actions/checkout@v4
        with:
          path: asi_gutenberg
      - uses: actions/checkout@v4
        with:
          repository: c00289/asi_escher
          path: asi_escher
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
